# Every version is approved by hand by the owner (no Sonatype token yet):
# S1 and S9 on 2026-11-25 (docs/spikes), Phase 1 Task 1 additions on 2026-11-25.
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
lifecycle = "2.11.1"
navigation3 = "1.2.2"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
openapi-generator = "7.27.0"
junit = "6.1.3"
json-schema-validator = "3.0.9"
jackson = "2.23.0"
robolectric = "4.18.1"
roborazzi = "1.79.0"
androidx-test-ext-junit = "1.3.0"
# Phase 1 Tasks 2-12, approved by hand 2026-11-25. detekt 2 is an alpha: compose-rules 0.6.8 needs it, and it matches Kotlin 2.4.
spotless = "8.12.0"
ktfmt = "0.64"
detekt = "2.0.0-alpha.6"
compose-rules = "0.6.8"
dependency-analysis = "3.9.0"
mockk = "1.14.12"
datastore = "1.3.0"
turbine = "1.2.1"
# javax.inject ships with Hilt; declared for the JVM modules that only need @Qualifier and @Inject.
javax-inject = "1"
# Phase 2, approved by the owner 2026-11-26: Room 3 (androidx.room3) and the SQLite driver it is built against.
room3 = "3.0.3"
sqlite = "2.7.1"

[libraries]
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-gradle-plugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
# Build logic
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

# App
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax-inject" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
